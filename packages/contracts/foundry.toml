[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["dependencies"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
gas_reports = ["NameCredit"]
# The 16-day simulation makes several thousand calls in one test.
gas_limit = "18446744073709551615"
memory_limit = 1073741824
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000

[invariant]
runs = 200
depth = 100
fail_on_revert = false

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[soldeer]
remappings_generate = true
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"

[dependencies]
"@openzeppelin-contracts" = "5.6.1"
forge-std = "1.17.0"

[lint]
# Terms here are measured in days. A validator can move a block time by seconds, which changes no outcome.
exclude_lints = ["block-timestamp"]
